# Units: time in hours, lengths in lattice sites (1 site = 15 um), fields non-dimensional.
name: default
grid:
  nx: 300
  ny: 300
  vessel_density: 0.004     # fraction of sites that are vessels
  seed_radius: 4            # initial tumor disk radius (sites)
init:
  antigen0: 0.6             # mean antigenicity of founder clone
  antigen_sd: 0.05
  pdl1_0: 0.2
  pdl1_sd: 0.05
macrophages:
  resident_density: 0.0015  # tissue-resident macrophages at start (fraction of sites)
  m0: 0.3                   # initial polarization (0 = M1, 1 = M2)
  cap: 20000
run:
  days: 40
  frame_every: 5            # agent steps per saved frame (5 x 6 min = 30 min)
  field_every: 5            # agent steps per field update
  field_sweeps: 4
  t_cap: 60000              # max T cells
params:
  dt: 0.1                   # h (6 min)
  T_div: 18.0               # h, tumor cell cycle
  T_death: 2000.0           # h, spontaneous apoptosis
  O_q: 0.15                 # oxygen below -> quiescent
  O_n: 0.04                 # oxygen below -> necrotic
  mu: 0.003                 # mutation prob per division (new lineage)
  mut_sd: 0.12              # trait mutation step
  vessel_regress: 0.0006    # per step, vessel engulfed by tumor
  T_clear: 12.0             # h, apoptotic debris cleared
  T_necro_clear: 600.0      # h, necrotic debris slowly cleared
  k_o_tissue: 0.003         # O2 uptake (per site^2, nondim) normal tissue
  k_o_tumor: 0.02           # O2 uptake tumor cells
  k_c: 0.01                 # chemokine decay
  chemo_secrete: 1.0        # chemokine production by live tumor cells
  chemo_apop: 6.0           # chemokine production by apoptotic (killed) cells
  k_s: 0.02                 # suppressor decay
  supp_secrete: 0.2         # suppressor (TGF-b-like) production by tumor cells
  T_life: 96.0              # h, T cell lifespan
  T_life_ex: 120.0           # h, exhausted T cells persist (terminal exhaustion accumulates)
  move_prob: 0.8            # per step
  tumor_drag: 0.5           # move-prob factor when stepping into tumor mass
  s_motility: 0.8           # motility reduction per unit suppressor
  chi: 3.0                  # chemotactic sensitivity
  k_kill: 0.04              # per step kill prob scale
  p_block: 0.9              # PD-L1 inhibition strength (anti-PD-1 -> lower)
  s_block: 0.8              # suppressor inhibition of killing
  e_kill: 0.08              # exhaustion per kill
  e_pdl1: 0.02              # exhaustion per hour of PD-L1 contact (x pdl1)
  p_prolif: 0.15            # T cell divides after kill
  max_div: 6                # max T cell divisions
  t_prime: 192.0            # h, priming delay before recruitment
  r_recruit: 0.08           # per vessel per hour per unit chemokine
  # --- adaptive resistance ---
  ifn_secrete: 1.0          # IFN-g production by each active T cell
  k_ifn: 0.05               # IFN-g decay (short range, ~4 sites)
  pdl1_ifn: 0.3             # max PD-L1 added to tumor cells by local IFN-g
  ifn_half: 0.1             # IFN-g level giving half-maximal PD-L1 induction
  # --- macrophages ---
  O_hyp: 0.3                # oxygen below which tumor cells are hypoxic (CCL2 source, M2 push)
  ccl2_secrete: 1.0         # CCL2-like production by hypoxic tumor cells
  k_ccl2: 0.01              # CCL2 decay
  r_mac: 0.04               # recruitment per vessel per hour per unit CCL2
  mac_move: 0.3             # move prob per step (slower than T cells)
  chi_mac: 2.0              # chemotaxis up CCL2
  chi_hyp: 3.0              # attraction toward low oxygen
  T_life_mac: 240.0         # h
  k_to_m2: 0.06             # per h, polarization toward M2 driven by suppressor + hypoxia
  k_to_m1: 0.15             # per h, polarization toward M1 driven by IFN-g
  mac_kill: 0.004           # per step phagocytosis prob of adjacent tumor cell x (1 - m)
  m1_chemo: 2.0             # CXCL9/10-like chemokine from M1 (x (1 - m))
  m2_supp: 2.0              # suppressor (TGF-b/IL-10-like) from M2 (x m)
  m2_angio: 0.0004          # per step chance an M2 in hypoxic tissue sprouts a vessel (x m)
  e_chronic: 0.004          # exhaustion per hour of target engagement (chronic antigen; not blocked by anti-PD-1)
treatment:
  day: null                 # anti-PD-1 start day (null = untreated)
  drug_eff: 0.9             # fraction of PD-1/PD-L1 signalling blocked
